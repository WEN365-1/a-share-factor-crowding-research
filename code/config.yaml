# ============================================================
# 因子拥挤与 A 股风格因子衰减 —— 全局配置
# 所有路径、日期区间、剔除参数、接口节流都在这里改，代码不硬编码
# ============================================================

paths:
  root: /home/user/金融科研1014
  code: /home/user/金融科研1014/code
  data: /home/user/金融科研1014/data
  logs: /home/user/金融科研1014/logs
  reports: /home/user/金融科研1014/reports

universe:
  start: "2015-01-01"        # 样本期起点：2015 是 A 股第一轮真正的杠杆牛熊
  end: "2025-12-31"
  exchanges: ["sh", "sz"]    # 不含北交所（Baostock 不覆盖）
  # 剔除规则（见 01-Research-Proposal 3.2 节）
  drop_st: true              # ST / *ST
  min_list_days: 180         # 上市不足 6 个月
  max_suspend_days: 10       # 当月停牌超过 10 个交易日
  drop_financial: true       # 金融行业（银行/非银）—— 两融权重异常，必须剔
  max_missing_ratio: 0.20    # 月内日收益缺失超过 20%

fetch:
  # Baostock 日线字段。adjustflag: 3=不复权, 2=前复权
  daily_fields: "date,code,open,high,low,close,preclose,volume,amount,turn,pctChg,tradestatus,isST,peTTM,pbMRQ,psTTM,pcfNcfTTM"
  adjust_flags: [3]          # 主拉不复权：价/量/换手/估值全部口径自洽，收益率用 pctChg
  save_front_adj: false      # 设为 true 会额外拉一份前复权（请求数翻倍）
  retry: 6
  retry_sleep: 2.0           # 重试退避基数（秒）
  request_sleep: 0.10        # 每次请求后停顿，避免被限流
  progress_every: 50         # 每 N 个单位打一次进度

margin:
  api: akshare
  exchanges: ["sse", "szse"]
  # 两融明细接口按单日取数，历史全量需按交易日循环
  request_sleep: 0.35
  retry: 5
  retry_sleep: 3.0

factors:
  n_groups: 10               # 十分位
  weighting: float_mv        # 流通市值加权（不用等权）
  skip_recent_month: true    # 动量跳过最近 1 个月
  list:
    - VAL                    # 价值：1/pbMRQ（Baostock 日频估值是 PIT 的，验证见 reports/）
    - SMB                    # 规模：流通市值
    - MOM                    # 动量：t-12 至 t-1 累计收益
    - QMJ                    # 质量：ROE（按 pubDate 对齐）
    - LOWVOL                 # 低波：过去 60 交易日收益标准差
    - TURN                   # 换手：过去 20 交易日平均换手率

crowding:
  comomentum:
    residual_model: FF3      # 日频收益对三因子回归取残差
    formation_window: 12     # 形成期月数
  margin_crowding:
    metric: net_financing_intensity   # 净融资流入强度
    add_coverage_control: true        # 关键：控制"组合两融覆盖率"以分离内生性
    coverage_floor: 0.30              # 覆盖率低于此值的月份标记为不可靠

runner:
  # 硬闸门（北京时间）。null = 不设闸门，一直跑到流水线结束或出现 STOP 文件
  stop_at: null
  tz_offset_hours: 8         # 主机是 UTC，用户在北京时间 UTC+8
  heartbeat_sec: 300         # 心跳间隔
  max_stage_hours: 12        # 单阶段最长运行时间，防止卡死

regression:
  horizons: [1, 3, 6, 12]
  newey_west_lags: 6
  cluster: factor            # 因子层面聚类
